# Real firmware corpus — Phase 0.1 real-image validation
#
# Pinned, verifiable sources of legitimate firmware and signed boot
# loaders used to enforce false-positive precision (FPR <= 10% at the
# bootkit-verdict level), plus slots for real malware samples (placed
# manually — never fetched automatically) used to enforce true-positive
# recall (TPR >= 90%).
#
# Populate with: scripts/fetch-real-corpus.sh
# Validate with: cargo test -p barzakh-adversary --test real_corpus

version = 1

