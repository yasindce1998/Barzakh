<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#e6edf3" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#00d4ff" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-magenta" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#ff00aa" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#00ff88" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" rx="12" fill="#0d1117"/>

  <!-- Title -->
  <text x="450" y="32" text-anchor="middle" fill="#e6edf3" font-size="16" font-weight="bold">BARZAKH — Firmware Security Research Platform</text>

  <!-- ═══════════ OFFENSE GROUP (left) ═══════════ -->
  <rect x="30" y="50" width="260" height="352" rx="10" fill="rgba(0,212,255,0.06)" stroke="#00d4ff" stroke-width="1.5" filter="url(#glow-cyan)"/>
  <text x="160" y="74" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="bold">⚔️  OFFENSE — 27 Modules</text>

  <!-- Offense items -->
  <rect x="50" y="90" width="220" height="34" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="160" y="112" text-anchor="middle" fill="#e6edf3" font-size="11">Ring 0 — DXE / Boot Hooks</text>

  <rect x="50" y="132" width="220" height="34" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="160" y="154" text-anchor="middle" fill="#e6edf3" font-size="11">Ring −1 — SMM Persistence</text>

  <rect x="50" y="174" width="220" height="34" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="160" y="196" text-anchor="middle" fill="#e6edf3" font-size="11">Ring −2 — ME / PSP Attacks</text>

  <rect x="50" y="216" width="220" height="34" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="160" y="238" text-anchor="middle" fill="#e6edf3" font-size="11">Ring −3 — DMA / Flash / fTPM</text>

  <rect x="50" y="258" width="220" height="34" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="160" y="280" text-anchor="middle" fill="#e6edf3" font-size="11">AArch64 — EL3 / TrustZone</text>

  <rect x="50" y="300" width="220" height="34" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="0.8"/>
  <text x="160" y="322" text-anchor="middle" fill="#e6edf3" font-size="11">RISC-V — M-Mode Hooks</text>

  <rect x="50" y="342" width="220" height="34" rx="6" fill="rgba(0,212,255,0.15)" stroke="#00d4ff" stroke-width="1.0"/>
  <text x="160" y="364" text-anchor="middle" fill="#00d4ff" font-size="11" font-weight="bold">Ring −4 — CPU Microarch</text>

  <!-- ═══════════ DEFENSE GROUP (right) ═══════════ -->
  <rect x="610" y="50" width="260" height="352" rx="10" fill="rgba(0,255,136,0.06)" stroke="#00ff88" stroke-width="1.5" filter="url(#glow-green)"/>
  <text x="740" y="74" text-anchor="middle" fill="#00ff88" font-size="13" font-weight="bold">🛡️  DEFENSE — 132 Detectors</text>

  <!-- Defense items -->
  <rect x="630" y="90" width="220" height="34" rx="6" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.8"/>
  <text x="740" y="112" text-anchor="middle" fill="#e6edf3" font-size="11">PCR / TPM Attestation</text>

  <rect x="630" y="132" width="220" height="34" rx="6" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.8"/>
  <text x="740" y="154" text-anchor="middle" fill="#e6edf3" font-size="11">Memory &amp; Hook Analysis</text>

  <rect x="630" y="174" width="220" height="34" rx="6" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.8"/>
  <text x="740" y="196" text-anchor="middle" fill="#e6edf3" font-size="11">Firmware Structure Validation</text>

  <rect x="630" y="216" width="220" height="34" rx="6" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.8"/>
  <text x="740" y="238" text-anchor="middle" fill="#e6edf3" font-size="11">Secure Boot Chain</text>

  <rect x="630" y="258" width="220" height="34" rx="6" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.8"/>
  <text x="740" y="280" text-anchor="middle" fill="#e6edf3" font-size="11">Behavioral Heuristics</text>

  <rect x="630" y="300" width="220" height="34" rx="6" fill="rgba(0,255,136,0.1)" stroke="#00ff88" stroke-width="0.8"/>
  <text x="740" y="322" text-anchor="middle" fill="#e6edf3" font-size="11">Ring −3 Subsystem Monitor</text>

  <rect x="630" y="342" width="220" height="34" rx="6" fill="rgba(0,255,136,0.15)" stroke="#00ff88" stroke-width="1.0"/>
  <text x="740" y="364" text-anchor="middle" fill="#00ff88" font-size="11" font-weight="bold">Ring −4 Microarch Detection</text>

  <!-- ═══════════ ADVERSARY GROUP (bottom center) ═══════════ -->
  <rect x="300" y="435" width="300" height="110" rx="10" fill="rgba(255,0,170,0.06)" stroke="#ff00aa" stroke-width="1.5" filter="url(#glow-magenta)"/>
  <text x="450" y="459" text-anchor="middle" fill="#ff00aa" font-size="13" font-weight="bold">🎯  ADVERSARY — 127 Payloads</text>

  <rect x="315" y="473" width="130" height="30" rx="6" fill="rgba(255,0,170,0.1)" stroke="#ff00aa" stroke-width="0.8"/>
  <text x="380" y="493" text-anchor="middle" fill="#e6edf3" font-size="10">Payload Generators</text>

  <rect x="455" y="473" width="130" height="30" rx="6" fill="rgba(255,0,170,0.1)" stroke="#ff00aa" stroke-width="0.8"/>
  <text x="520" y="493" text-anchor="middle" fill="#e6edf3" font-size="10">Corpus Builder</text>

  <rect x="385" y="511" width="130" height="30" rx="6" fill="rgba(255,0,170,0.1)" stroke="#ff00aa" stroke-width="0.8"/>
  <text x="450" y="531" text-anchor="middle" fill="#e6edf3" font-size="10">TPR / FPR Metrics</text>

  <!-- ═══════════ ARROWS: Offense → Defense ═══════════ -->
  <!-- Ring 0 → Memory Analysis -->
  <path d="M270,107 C380,107 500,149 630,149" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)" opacity="0.7"/>
  <!-- Ring -1 → Behavioral -->
  <path d="M270,149 C420,149 500,275 630,275" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)" opacity="0.7"/>
  <!-- Ring -2 → Ring -3 Subsystem -->
  <path d="M270,191 C420,191 500,317 630,317" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)" opacity="0.7"/>
  <!-- Ring -3 → Ring -3 Subsystem -->
  <path d="M270,233 C400,233 520,317 630,317" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)" opacity="0.7"/>
  <!-- AArch64 → Firmware Structure -->
  <path d="M270,275 C420,275 500,191 630,191" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)" opacity="0.7"/>
  <!-- RISC-V → Firmware Structure -->
  <path d="M270,317 C400,317 520,191 630,191" fill="none" stroke="#00d4ff" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)" opacity="0.7"/>
  <!-- Ring -4 → Ring -4 Detection -->
  <path d="M270,359 C420,359 520,359 630,359" fill="none" stroke="#00d4ff" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-cyan)" opacity="0.9"/>

  <!-- ═══════════ ARROWS: Adversary → Defense ═══════════ -->
  <path d="M450,435 L740,402" fill="none" stroke="#ff00aa" stroke-width="1.5" marker-end="url(#arrow-magenta)" opacity="0.8"/>
  <text x="600" y="412" text-anchor="middle" fill="#8b949e" font-size="9" transform="rotate(-5,600,412)">tampered images</text>

  <!-- ═══════════ ARROW: Defense → Metrics ═══════════ -->
  <path d="M740,402 L740,460 C740,500 600,525 520,525" fill="none" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-green)" opacity="0.8"/>
  <text x="760" y="462" fill="#8b949e" font-size="9">scan results</text>

  <!-- Center flow label -->
  <text x="450" y="220" text-anchor="middle" fill="#8b949e" font-size="10" font-style="italic">closed-loop validation</text>

  <!-- ═══════════ PLATFORM SERVICES GROUP (bottom, full width) ═══════════ -->
  <rect x="30" y="565" width="840" height="115" rx="10" fill="rgba(187,128,255,0.06)" stroke="#bb80ff" stroke-width="1.5"/>
  <text x="450" y="589" text-anchor="middle" fill="#bb80ff" font-size="13" font-weight="bold">🧩  PLATFORM SERVICES — 4 Binaries</text>

  <rect x="50" y="602" width="150" height="34" rx="6" fill="rgba(187,128,255,0.1)" stroke="#bb80ff" stroke-width="0.8"/>
  <text x="125" y="624" text-anchor="middle" fill="#e6edf3" font-size="10">barzakh-intel — IOC/YARA</text>

  <rect x="215" y="602" width="150" height="34" rx="6" fill="rgba(187,128,255,0.1)" stroke="#bb80ff" stroke-width="0.8"/>
  <text x="290" y="624" text-anchor="middle" fill="#e6edf3" font-size="10">barzakh-ml — iforest/LR</text>

  <rect x="380" y="602" width="150" height="34" rx="6" fill="rgba(187,128,255,0.1)" stroke="#bb80ff" stroke-width="0.8"/>
  <text x="455" y="624" text-anchor="middle" fill="#e6edf3" font-size="10">barzakh-store — SQLite</text>

  <rect x="545" y="602" width="150" height="34" rx="6" fill="rgba(187,128,255,0.1)" stroke="#bb80ff" stroke-width="0.8"/>
  <text x="620" y="624" text-anchor="middle" fill="#e6edf3" font-size="10">barzakh-server — API 8420</text>

  <rect x="710" y="602" width="150" height="34" rx="6" fill="rgba(187,128,255,0.1)" stroke="#bb80ff" stroke-width="0.8"/>
  <text x="785" y="624" text-anchor="middle" fill="#e6edf3" font-size="10">barzakh-agent — SIEM</text>

  <text x="450" y="660" text-anchor="middle" fill="#8b949e" font-size="9" font-style="italic">feeds · YARA-subset rules · MISP export · ML models · history · knowledge base · dashboard · monitoring</text>
</svg>
