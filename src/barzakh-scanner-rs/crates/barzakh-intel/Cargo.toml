[package]
name = "barzakh-intel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Threat intelligence for the Barzakh scanner: IOC feeds, YARA-subset rules, ATT&CK mapping, MISP export"

[dependencies]
barzakh-core = { path = "../barzakh-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
aho-corasick = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
