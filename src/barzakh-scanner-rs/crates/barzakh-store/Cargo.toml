[package]
name = "barzakh-store"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Persistent storage for Barzakh: scan history, diffing, trends and the firmware knowledge base"

[dependencies]
barzakh-core = { path = "../barzakh-core" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
