[package]
name = "barzakh-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "REST API and web dashboard for the Barzakh firmware security platform"

[[bin]]
name = "barzakh-server"
path = "src/main.rs"

[dependencies]
barzakh-core = { path = "../barzakh-core" }
barzakh-adversary = { path = "../barzakh-adversary" }
barzakh-store = { path = "../barzakh-store" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

# cargo-binstall: release assets are raw binaries named
# <binary>-<target-triple> (see .github/workflows/release.yml at the repo
# root).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/barzakh-server-{ target }{ archive-suffix }"
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"
