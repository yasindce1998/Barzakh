[package]
name = "barzakh-adversary"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Red-team payload generator for testing the Barzakh scanner"

[dependencies]
barzakh-core = { path = "../barzakh-core" }
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
byteorder = "1"
crc32fast = "1"
toml = "0.8"
tempfile = "3"

[dev-dependencies]
tempfile = "3"

# cargo-binstall: release assets are raw binaries named
# <binary>-<target-triple> (see .github/workflows/release.yml at the repo
# root).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/barzakh-adversary-{ target }{ archive-suffix }"
pkg-fmt = "bin"
bin-dir = "{ bin }{ binary-ext }"
